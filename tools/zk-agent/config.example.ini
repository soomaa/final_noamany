; Copy this file to config.ini next to noamany_zk_agent.py and fill it in.

[device]
; Fingerprint device address on the gym network (Device list in the vendor software).
ip = 192.168.1.201
port = 4370
; Communication password set on the device:
;   Menu (M/OK) > Comm. > PC Connection > Comm Key   (0 if none)
comm_key = 0

[noamany]
api_url = https://final.noamanycenter.com/api
; The device's number in Noamany: Attendance > Devices (add the device there first).
device_id = 1
; Same value as ATTENDANCE_AGENT_TOKEN in the server's backend .env
token =
; Optional extra CA bundle. Not normally needed: isrg-root-x1.pem next to the agent
; already covers Let's Encrypt on old Windows 7.
ca_file =

[agent]
interval_seconds = 60
; Send punches from this moment on (YYYY-MM-DD HH:MM:SS). Empty = from the first run.
; Used only on the very first run; after that state.json remembers where it stopped.
start_from =
state_file = state.json
log_file = agent.log
