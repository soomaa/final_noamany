<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>اشتراك أونلاين | النعماني</title><link rel="stylesheet" href="/src/styles.css"><link rel="stylesheet" href="subscribe.css"></head>
<body><main class="subscribe-page"><a class="back-link" href="index.html#membership">← العودة للباقات</a><section class="subscribe-card" aria-labelledby="planName"><p class="eyebrow">اشتراك أونلاين</p><ol class="checkout-steps" aria-label="خطوات الاشتراك"><li class="active" data-indicator="details">1. بيانات الاشتراك</li><li data-indicator="payment">2. الدفع والإرسال</li></ol>
<section data-step="member"><h1 id="planName">جاري تحميل الباقة...</h1><p id="planMeta"></p><div class="plan-details" id="planDetails" hidden></div><form id="memberForm" novalidate><input type="hidden" name="subscriptionTypeId" id="subscriptionTypeId"><label>كود العضو *<input name="memberCode" autocomplete="off" required placeholder="مثال: M-1024"></label><label>الاسم المسجل بالعضوية *<input name="customerName" autocomplete="name" required placeholder="اكتب الاسم كما هو مسجل"></label><button class="btn primary" type="submit">تأكيد العضوية وعرض طرق الدفع ←</button></form>
<section id="paymentChoices" hidden aria-live="polite"><h2>اختر طريقة الدفع</h2><p class="step-help">اختر الطريقة المناسبة ثم انتقل لإرفاق إثبات الدفع.</p><div class="payment-methods" id="paymentMethods"></div><button class="btn primary" id="continueToPayment" type="button" disabled>تأكيد الاشتراك والانتقال للدفع ←</button></section></section>
<section data-step="payment" hidden><h1>إتمام الدفع</h1><p id="paymentPlanSummary"></p><form id="subscriptionForm"><input type="hidden" name="subscriptionTypeId" id="paymentSubscriptionTypeId"><input type="hidden" name="paymentMethodId" id="paymentMethodId"><input type="hidden" name="memberCode" id="paymentMemberCode"><input type="hidden" name="customerName" id="paymentCustomerName"><label>تاريخ بداية الاشتراك *<input type="date" name="startDate" required></label><label>إثبات الدفع *<input type="file" name="paymentProof" accept="image/jpeg,image/png,image/webp" required></label><label>ملاحظات <textarea name="notes" placeholder="أي ملاحظة تريد إضافتها (اختياري)"></textarea></label><div class="form-actions"><button class="btn ghost" id="backToDetails" type="button">رجوع</button><button class="btn primary" type="submit">إرسال طلب الاشتراك ←</button></div></form></section><p id="subscriptionMessage" role="status" aria-live="polite"></p></section></main><script type="module" src="src/subscribe.js"></script></body></html>
