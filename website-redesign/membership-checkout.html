<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>إتمام العضوية | النعماني</title><link rel="stylesheet" href="/src/font.css"><link rel="stylesheet" href="/src/membership.css"></head>
<body><header class="membership-header"><a href="/" class="membership-brand"><img src="/assets/noamany-logo.png" alt="النعماني"></a><a id="backToPackage" href="/">العودة للعضوية</a></header>
<main class="membership-flow"><p class="eyebrow">إتمام الاشتراك</p><h1>أرسل طلب عضويتك</h1><p class="membership-note">السعر وطريقة الدفع يحددهما النظام حسب الفرع والباقة، ولا يتم اعتماد الاشتراك إلا بعد مراجعة إثبات التحويل.</p><div id="checkoutState" class="membership-state" role="status" aria-live="polite">جاري تجهيز الطلب…</div><form id="membershipCheckoutForm" hidden><section class="form-card"><h2 id="packageSummary">الباقة</h2><label>الفرع<select name="branchId" id="checkoutBranch" required></select></label><label>الاسم بالكامل<input name="fullName" autocomplete="name" required minlength="3"></label><label>القسم<select name="gender" required><option value="">اختر القسم</option><option value="male">رجال</option><option value="female">سيدات</option></select></label><label>رقم الموبايل<input name="phone" inputmode="tel" autocomplete="tel" required pattern="01[0125][0-9]{8}" placeholder="01xxxxxxxxx"></label><label>البريد الإلكتروني (اختياري)<input name="email" type="email" autocomplete="email"></label><label>طريقة الدفع<select name="paymentMethodId" id="paymentMethod" required></select></label><p id="paymentDestination" class="payment-destination" aria-live="polite"></p><label>إثبات التحويل<input name="proof" type="file" accept="application/pdf,image/png,image/jpeg" required aria-describedby="proofHelp"></label><small id="proofHelp">PDF أو PNG أو JPG بحجم أقصى 5 ميجابايت.</small></section><button class="membership-action" type="submit">إرسال طلب الاشتراك</button></form></main>
<script type="module" src="/src/membership-checkout.js"></script></body></html>
