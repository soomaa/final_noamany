<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Body measurement comparison</title><style>
@font-face{font-family:Tajawal;src:url('tajawal.woff2') format('woff2');font-display:swap}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Tajawal,Arial,sans-serif;color:#334951;background:transparent}body{display:flex;flex-direction:column}.dark{color:#d5e4e8}#controls{display:flex;justify-content:center;gap:8px;padding:6px}button{min-height:44px;min-width:64px;padding:8px 14px;border:1px solid #c6d4d8;border-radius:8px;background:transparent;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#0b7386;color:white;border-color:#0b7386}button:focus-visible{outline:2px solid #0b7386;outline-offset:3px}#stage{position:relative;min-height:0;flex:1;touch-action:pan-y}canvas{display:block;width:100%;height:100%}#labels{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:center;font-size:14px;font-weight:600;padding:8px 6px}#hint{font-size:12px;line-height:1.6;text-align:center;margin:6px 12px 0}#status{margin:12px;text-align:center;font-size:14px;line-height:1.6}[hidden]{display:none!important}
</style></head><body><div id="controls" role="group" aria-label="Body view"><button data-angle="front" aria-pressed="true">أمامي</button><button data-angle="side" aria-pressed="false">جانبي</button><button data-angle="back" aria-pressed="false">خلفي</button></div><div id="labels" hidden><span id="current-label"></span><span id="target-label"></span></div><div id="stage" role="img" aria-label="Approximate body avatars"></div><p id="status" role="status">تحميل موديل الجسم…</p><p id="hint"></p><script src="viewer.js"></script></body></html>
